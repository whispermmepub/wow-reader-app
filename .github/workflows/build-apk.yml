name: Build WoW Reader APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Source checks
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          test -s app/src/main/java/com/whisper/wowreader/MainActivity.java
          test -s app/src/main/java/com/whisper/wowreader/EpubUtil.java
          test -s app/src/main/java/com/whisper/wowreader/PageCurlView.java
          test -s app/src/main/java/com/whisper/wowreader/ReaderAnnotationStore.java
          test -s app/src/main/java/com/whisper/wowreader/ReaderFontStore.java
          test -s app/src/main/java/com/whisper/wowreader/SplashActivity.java
          test -s app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          test -s app/src/main/res/drawable/wow_logo.webp
          test -s app/src/main/assets/fonts/pyidaungsu.woff2
          test -s app/src/main/assets/fonts/pyidaungsu_native.ttf
          test -s app/src/main/assets/fonts/yoeshin.woff2
          test -s app/src/main/assets/fonts/burma2.woff2
          test -s app/src/main/assets/fonts/burma001.ttf
          test -s app/src/main/assets/fonts/m01_pupu_bold.ttf
          test -s app/src/main/assets/fonts/myanmar_ayar_typewriter.ttf
          test -s app/src/main/assets/fonts/phantee_hand_written.ttf
          grep -q "versionCode 24" app/build.gradle
          grep -q "versionName '2.12.0'" app/build.gradle
          grep -q "androidx.recyclerview:recyclerview:1.3.2" app/build.gradle
          grep -q "play-services-auth:21.5.0" app/build.gradle
          MAIN=app/src/main/java/com/whisper/wowreader/MainActivity.java
          READER=app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          CURL=app/src/main/java/com/whisper/wowreader/PageCurlView.java
          SPLASH=app/src/main/java/com/whisper/wowreader/SplashActivity.java
          DRIVE=app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          grep -q "RecyclerView" "$MAIN"
          grep -q "GridLayoutManager" "$MAIN"
          grep -q "calculateLibraryColumns" "$MAIN"
          grep -q "setItemViewCacheSize(20)" "$MAIN"
          grep -q "Typeface.createFromAsset(getAssets(), \"fonts/pyidaungsu_native.ttf\")" "$MAIN"
          grep -q "library_sort" "$MAIN"
          grep -q "cachedLibraryAuthor" "$MAIN"
          grep -q "showAuthorsDialog" "$MAIN"
          grep -q "library_author_" "$MAIN"
          grep -q "showAccountMenu" "$MAIN"
          grep -q "performGoogleBackup" "$MAIN"
          grep -q "performGoogleRestore" "$MAIN"
          grep -q "maybeAutoGoogleSync" "$MAIN"
          grep -q "ExploreLogoView" "$MAIN"
          grep -q '＋  Add book' "$MAIN"
          grep -q "AuthorizationClient" "$DRIVE"
          grep -q "DRIVE_APPFOLDER" "$DRIVE"
          grep -q "appDataFolder" "$DRIVE"
          grep -q "BackupCheckCallback" "$DRIVE"
          grep -q "wow_reader_backup_v1.zip" "$DRIVE"
          ! grep -q "java.util.function.Consumer" "$DRIVE"
          grep -q "OvershootInterpolator" "$SPLASH"
          grep -q "Your library · your reading space" "$SPLASH"
          grep -q "setDecorFitsSystemWindows(false)" "$READER"
          grep -q "BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE" "$READER"
          grep -q 'reader_v210_animation_default_applied' "$READER"
          grep -q 'pageAnimation = "none"' "$READER"
          grep -q 'chapterLoadGeneration' "$READER"
          grep -q 'stableHits' "$READER"
          grep -q 'generation != chapterLoadGeneration' "$READER"
          grep -q 'Display options' "$READER"
          grep -q 'reader_night_light' "$READER"
          grep -q 'Night Light' "$READER"
          grep -q 'Reading progress' "$READER"
          grep -q 'seekToOverallProgress' "$READER"
          grep -q 'scheduleChromeAutoHide' "$READER"
          grep -q 'More reader settings' "$READER"
          grep -q 'Reading brightness' "$READER"
          grep -q 'showAdvancedReaderSettings' "$READER"
          grep -q "ReaderAnnotationStore.add" "$READER"
          grep -q "sync_updated_ms" "$READER"
          grep -q "MESH_W = 60" "$CURL"
          git diff --check

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Android lint
        run: gradle :app:lintRelease --stacktrace

      - name: APK smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='24'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.12.0'"
          "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'
          unzip -l "$APK" | grep -q 'assets/fonts/pyidaungsu_native.ttf'

      - name: Collect APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-v2.12.0-unsigned.apk
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.12.0
          path: |
            WoW-Reader-v2.12.0-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 14
