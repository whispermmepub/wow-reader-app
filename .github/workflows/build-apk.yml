name: Build WoW Reader stable v2.17.7 APK and AAB

on:
  push:
    branches: [main, play-store-api36]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Stable source checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q "compileSdk 36" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          grep -q "versionCode 47" app/build.gradle
          grep -q "versionName '2.17.7'" app/build.gradle
          grep -q "myanmar-calendar:1.1.1.RELEASE" app/build.gradle
          grep -q "swiperefreshlayout:1.1.0" app/build.gradle
          test -s app/google-services.json
          test -s app/src/main/java/com/whisper/wowreader/MainActivity.java
          test -s app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          test -s app/src/main/java/com/whisper/wowreader/ReaderSearchIndex.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingProgressStore.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingCalendarActivity.java
          test -s app/src/main/java/com/whisper/wowreader/LibraryShelfStore.java
          test -s app/src/main/java/com/whisper/wowreader/GoogleAccountAuth.java
          test -s app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          grep -q 'GoogleAuthProvider.getCredential' app/src/main/java/com/whisper/wowreader/GoogleAccountAuth.java
          grep -q 'Scopes.DRIVE_APPFOLDER' app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          grep -q 'smartBackup' app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          ! grep -q 'Show on page' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'lastReaderLinkTapMs' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'handleReaderTapResolved' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'looksLikeFootnoteDestination' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'renderBookSearchResults' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'ReaderSearchIndex.search' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'ReadingProgressStore.set' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'SwipeRefreshLayout' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'renameShelf' app/src/main/java/com/whisper/wowreader/LibraryShelfStore.java
          grep -q 'deleteShelf' app/src/main/java/com/whisper/wowreader/LibraryShelfStore.java
          test ! -e app/src/main/java/com/whisper/wowreader/AutoLibrarySync.java
          git diff --check

      - name: Build debug APK release APK and AAB
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug :app:lintRelease --stacktrace

      - name: APK smoke checks
        shell: bash
        run: |
          set -euo pipefail
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          RELEASE=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$DEBUG"
          test -s "$RELEASE"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          for APK in "$DEBUG" "$RELEASE"; do
            "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
            "$AAPT" dump badging "$APK" | grep -q "versionCode='47'"
            "$AAPT" dump badging "$APK" | grep -q "versionName='2.17.7'"
            "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          done
          unzip -l "$RELEASE" | grep -q 'assets/fonts/pyidaungsu_native.ttf'
          unzip -l "$AAB" | grep -q 'base/assets/fonts/pyidaungsu_native.ttf'

      - name: Collect builds
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WoW-Reader-v2.17.7-v47-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-v2.17.7-v47-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab WoW-Reader-v2.17.7-v47-release-unsigned.aab

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.17.7-v47-stable
          path: |
            WoW-Reader-v2.17.7-v47-debug.apk
            WoW-Reader-v2.17.7-v47-release-unsigned.apk
            WoW-Reader-v2.17.7-v47-release-unsigned.aab
          if-no-files-found: error
          retention-days: 14
