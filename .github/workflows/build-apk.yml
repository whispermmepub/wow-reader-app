name: Build WoW Reader APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Source checks
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          test -s app/src/main/java/com/whisper/wowreader/MainActivity.java
          test -s app/src/main/java/com/whisper/wowreader/EpubUtil.java
          test -s app/src/main/java/com/whisper/wowreader/PageCurlView.java
          test -s app/src/main/java/com/whisper/wowreader/ReaderAnnotationStore.java
          test -s app/src/main/java/com/whisper/wowreader/ReaderFontStore.java
          test -s app/src/main/java/com/whisper/wowreader/SplashActivity.java
          test -s app/src/main/res/drawable/wow_logo.webp
          test -s app/src/main/assets/fonts/pyidaungsu.woff2
          test -s app/src/main/assets/fonts/pyidaungsu_native.ttf
          test -s app/src/main/assets/fonts/yoeshin.woff2
          test -s app/src/main/assets/fonts/burma2.woff2
          test -s app/src/main/assets/fonts/burma001.ttf
          test -s app/src/main/assets/fonts/m01_pupu_bold.ttf
          test -s app/src/main/assets/fonts/myanmar_ayar_typewriter.ttf
          test -s app/src/main/assets/fonts/phantee_hand_written.ttf
          grep -q "versionCode 21" app/build.gradle
          grep -q "versionName '2.9.0'" app/build.gradle
          grep -q "androidx.recyclerview:recyclerview:1.3.2" app/build.gradle
          ! grep -q "play-services-auth" app/build.gradle
          ! test -e app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          MAIN=app/src/main/java/com/whisper/wowreader/MainActivity.java
          READER=app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          CURL=app/src/main/java/com/whisper/wowreader/PageCurlView.java
          grep -q "RecyclerView" "$MAIN"
          grep -q "GridLayoutManager" "$MAIN"
          grep -q "calculateLibraryColumns" "$MAIN"
          grep -q "minCardDp = 154f" "$MAIN"
          grep -q "Math.min(6, columns)" "$MAIN"
          grep -q "updateLibraryColumnsForWidth" "$MAIN"
          grep -q "addOnLayoutChangeListener" "$MAIN"
          grep -q "Typeface.createFromAsset(getAssets(), \"fonts/pyidaungsu_native.ttf\")" "$MAIN"
          grep -q "library_sort" "$MAIN"
          grep -q "Added to Library" "$MAIN"
          grep -q "importBook(data,false)" "$MAIN"
          grep -q "ExploreLogoView" "$MAIN"
          grep -q '＋  Add book' "$MAIN"
          grep -q "onSingleTapUp" "$READER"
          grep -q "turnPageFromTap" "$READER"
          grep -q "projected >= 0.23f" "$READER"
          grep -q "startTapCurl" "$CURL"
          grep -q "setDecorFitsSystemWindows(false)" "$READER"
          grep -q "BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE" "$READER"
          grep -q "WindowInsets.Type.statusBars" "$READER"
          grep -q "WindowInsets.Type.navigationBars" "$READER"
          grep -q "LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES" "$READER"
          grep -q "setStatusBarColor(Color.TRANSPARENT)" "$READER"
          grep -q "setNavigationBarColor(Color.TRANSPARENT)" "$READER"
          test "$(grep -c 'public void onWindowFocusChanged' "$READER")" -eq 1
          test "$(grep -c 'protected void onResume' "$READER")" -eq 1
          grep -q "postDelayed(this::enterImmersive, 55L)" "$READER"
          grep -q "postDelayed(this::enterImmersive, 80L)" "$READER"
          grep -q "ReaderAnnotationStore.add" "$READER"
          grep -q "MESH_W = 60" "$CURL"
          git diff --check

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Android lint
        run: gradle :app:lintRelease --stacktrace

      - name: APK smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='21'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.9.0'"
          "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'
          unzip -l "$APK" | grep -q 'assets/fonts/pyidaungsu_native.ttf'

      - name: Collect APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk WoW-Reader-v2.9.0-unsigned.apk
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.9.0
          path: |
            WoW-Reader-v2.9.0-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 14
