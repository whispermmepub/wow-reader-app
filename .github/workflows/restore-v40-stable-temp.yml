name: Restore WoW Reader production v40 stable app tree

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-v40-stable-temp.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact stable v40 app tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout afc75339dece9ff175f8d498a9744fc88bbb6a62 -- app
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q "versionCode 40" app/build.gradle
          grep -q "versionName '2.17.0'" app/build.gradle
          test -s app/google-services.json
          grep -q 'GoogleAuthProvider.getCredential' app/src/main/java/com/whisper/wowreader/GoogleAccountAuth.java
          grep -q 'Scopes.DRIVE_APPFOLDER' app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          git diff --check
      - name: Commit stable production restore
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AungSoe Moe'
          git config user.email '61192036+whispermmepub@users.noreply.github.com'
          git add app
          git diff --cached --check
          git commit -m 'Restore WoW Reader production stable v2.17.0 v40'
          git push origin HEAD:main
