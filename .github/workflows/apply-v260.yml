name: Apply WoW Reader v2.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v260.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.6 changes
        run: python3 tools/apply_v260.py

      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RecyclerView' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'libraryColumns' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'cancelNativeSelectionForPaperGesture' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'paperGestureChapterBoundary' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'replaceTarget' app/src/main/java/com/whisper/wowreader/PageCurlView.java
          grep -q 'versionCode 18' app/build.gradle
          grep -q "versionName '2.6.0'" app/build.gradle
          grep -q 'androidx.recyclerview:recyclerview:1.3.2' app/build.gradle
          git diff --check

      - name: Commit v2.6 app source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Professional library UX and gesture arbitration for v2.6.0'
          git push origin HEAD:main
