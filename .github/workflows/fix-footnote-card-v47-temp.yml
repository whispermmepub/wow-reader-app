name: Fix footnote card-only v2.17.7 v47

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-footnote-card-v47-temp.yml'

permissions:
  contents: write

jobs:
  fix-build-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WOW_RELEASE_STORE_PASSWORD: ${{ secrets.WOW_RELEASE_STORE_PASSWORD }}
      WOW_RELEASE_KEY_ALIAS: ${{ secrets.WOW_RELEASE_KEY_ALIAS }}
      WOW_RELEASE_KEY_PASSWORD: ${{ secrets.WOW_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Patch footnote behavior and version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/whisper/wowreader/BookReaderActivity.java')
          s=p.read_text()
          marker='private boolean tapHitTestPending = false;'
          assert marker in s
          s=s.replace(marker, marker+'\n    private volatile long lastReaderLinkTapMs = 0L;', 1)
          sig='private void handleReaderTap(float x, float y) {'
          assert sig in s
          s=s.replace(sig,
              'private void handleReaderTap(float x, float y) {\n'
              '        if (root == null) return;\n'
              '        final float tapX = x;\n'
              '        final float tapY = y;\n'
              '        root.postDelayed(() -> {\n'
              '            if (android.os.SystemClock.elapsedRealtime() - lastReaderLinkTapMs < 500L) return;\n'
              '            handleReaderTapResolved(tapX, tapY);\n'
              '        }, 120L);\n'
              '    }\n\n'
              '    private void handleReaderTapResolved(float x, float y) {', 1)
          bridge='public boolean onReaderLinkTap(String href, String epubType, String role, String rel, String cssClass, String sourceId, String label) {'
          assert bridge in s
          s=s.replace(bridge, bridge+'\n            lastReaderLinkTapMs = android.os.SystemClock.elapsedRealtime();', 1)
          pat=re.compile(r'\n\s*TextView show = new TextView\(this\);.*?card\.addView\(show, showLp\);', re.S)
          s,n=pat.subn('',s,count=1)
          assert n==1, n
          old='String text = note.text == null ? "" : note.text.trim();'
          assert old in s
          s=s.replace(old, old+'\n        text = text.replaceFirst("(?i)^\\\\s*Unknown\\\\s*", "").trim();',1)
          s=s.replace('Footnote text could not be previewed. You can still open it on the page.','Footnote text could not be previewed.',1)
          p.write_text(s)
          g=Path('app/build.gradle')
          b=g.read_text().replace('versionCode 46','versionCode 47',1).replace("versionName '2.17.6'","versionName '2.17.7'",1)
          g.write_text(b)
          PY
          grep -q "versionCode 47" app/build.gradle
          grep -q "versionName '2.17.7'" app/build.gradle
          grep -q 'lastReaderLinkTapMs' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'handleReaderTapResolved' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          ! grep -q 'Show on page' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          ! grep -q 'navigateToFootnote(note)' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git diff --check
      - name: Build and lint
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintDebug :app:lintRelease --stacktrace
      - name: Smoke checks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='47'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.17.7'"
      - name: Commit v47 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/BookReaderActivity.java app/build.gradle
          git commit -m 'Fix footnote card navigation and page-turn conflict in v2.17.7 v47'
          git push origin HEAD:main
      - name: Prepare protected signing key
        env:
          WOW_RELEASE_KEYSTORE_BASE64: ${{ secrets.WOW_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WOW_RELEASE_KEYSTORE_BASE64"
          test -n "$WOW_RELEASE_STORE_PASSWORD"
          test -n "$WOW_RELEASE_KEY_ALIAS"
          test -n "$WOW_RELEASE_KEY_PASSWORD"
          WOW_RELEASE_STORE_FILE="$RUNNER_TEMP/wow-reader-production.jks"
          printf '%s' "$WOW_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$WOW_RELEASE_STORE_FILE"
          chmod 600 "$WOW_RELEASE_STORE_FILE"
          echo "WOW_RELEASE_STORE_FILE=$WOW_RELEASE_STORE_FILE" >> "$GITHUB_ENV"
      - name: Build signed production APK and AAB
        run: gradle :app:clean :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Verify production signature and collect
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"; test -s "$AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -qi '21:17:d3:1e:01:eb:24:ea:e3:fe:4a:26:88:c8:c7:12:cd:76:71:f1'
          keytool -printcert -jarfile "$AAB" | grep -qi '21:17:d3:1e:01:eb:24:ea:e3:fe:4a:26:88:c8:c7:12:cd:76:71:f1'
          cp "$APK" WoW-Reader-v2.17.7-v47-unified-production.apk
          cp "$AAB" WoW-Reader-v2.17.7-v47-unified-production.aab
          sha256sum WoW-Reader-v2.17.7-v47-unified-production.apk > WoW-Reader-v2.17.7-v47-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.17.7-v47-unified-production
          path: |
            WoW-Reader-v2.17.7-v47-unified-production.apk
            WoW-Reader-v2.17.7-v47-unified-production.aab
            WoW-Reader-v2.17.7-v47-sha256.txt
          retention-days: 14
