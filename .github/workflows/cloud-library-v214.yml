name: Enable WoW Reader v2.14 Cloud Library

on:
  push:
    branches: [main]
    paths:
      - 'tools/enable_cloud_library_v214.py'
      - '.github/workflows/cloud-library-v214.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply cloud library migration
        run: python3 tools/enable_cloud_library_v214.py

      - name: Verify source changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 26' app/build.gradle
          grep -q "versionName '2.14.0'" app/build.gradle
          grep -q 'googleDrive = new GoogleDriveSync(this)' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'accountButton = iconButton("G")' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'google_last_synced_change_ms' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'Google Account cloud library is available' README.md
          git diff --check

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Android lint
        run: gradle :app:lintRelease --stacktrace

      - name: Commit v2.14 cloud library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/MainActivity.java app/build.gradle .github/workflows/build-apk.yml README.md
          if git diff --cached --quiet; then
            echo 'No migration changes to commit'
            exit 0
          fi
          git commit -m 'Enable Google account cloud library in WoW Reader v2.14.0'
          git push origin HEAD:main
