name: Enable Reader Auto Sync

on:
  push:
    branches: [main]
    paths:
      - 'tools/enable_reader_auto_sync.py'
      - '.github/workflows/reader-auto-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply automatic sync migration
        run: python3 tools/enable_reader_auto_sync.py

      - name: Verify automatic sync source
        shell: bash
        run: |
          set -euo pipefail
          AUTO=app/src/main/java/com/whisper/wowreader/GoogleAutoSync.java
          MAIN=app/src/main/java/com/whisper/wowreader/MainActivity.java
          READER=app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          DRIVE=app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          test -s "$AUTO"
          grep -q 'class GoogleAutoSync' "$AUTO"
          grep -q 'authorizeSilently' "$DRIVE"
          grep -q 'GoogleAutoSync.scheduleSoon(this)' "$MAIN"
          grep -q 'GoogleAutoSync.scheduleSoon(this)' "$READER"
          grep -q 'GoogleAutoSync.flush(this)' "$READER"
          git diff --check

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Android lint
        run: gradle :app:lintRelease --stacktrace

      - name: Commit automatic sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/whisper/wowreader/GoogleAutoSync.java \
            app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java \
            app/src/main/java/com/whisper/wowreader/MainActivity.java \
            app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          if git diff --cached --quiet; then
            echo 'No automatic sync changes to commit'
            exit 0
          fi
          git commit -m 'Enable automatic Google cloud sync while reading'
          git push origin HEAD:main
