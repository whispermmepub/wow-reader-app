name: Validate WoW Reader UX refresh

on:
  push:
    branches: [ux-refresh-v214]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UX branch
        uses: actions/checkout@v4
        with:
          ref: ux-refresh-v214
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Materialize guarded patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/ux_patch.py
          python /tmp/ux_patch.py

      - name: Regression guard checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'WOW_UX_REFRESH_V214' app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'WOW_UX_REFRESH_V214' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          test -s app/src/main/java/com/whisper/wowreader/ReaderLoadingBackdropView.java
          grep -q 'Opening book…' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'String\[\] animLabels = {"None", "Slide"}' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'startNativeSlidePageTurn' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'prewarmAdjacentChapters' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'GoogleAuthProvider.getCredential' app/src/main/java/com/whisper/wowreader/GoogleAccountAuth.java
          grep -q 'Scopes.DRIVE_APPFOLDER' app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          git fetch origin main --quiet
          git diff --exit-code origin/main -- app/src/main/java/com/whisper/wowreader/GoogleAccountAuth.java app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java app/src/main/java/com/whisper/wowreader/GoogleAutoSync.java app/google-services.json
          git diff --check

      - name: Build release and lint
        run: gradle :app:clean :app:assembleRelease :app:lintRelease --stacktrace

      - name: Commit validated UX changes
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/java/com/whisper/wowreader/MainActivity.java \
                  app/src/main/java/com/whisper/wowreader/BookReaderActivity.java \
                  app/src/main/java/com/whisper/wowreader/ReaderLoadingBackdropView.java
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh reader UI and smooth chapter transitions'
          git push origin HEAD:ux-refresh-v214
