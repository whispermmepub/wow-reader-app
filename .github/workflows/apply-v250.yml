name: Apply WoW Reader v2.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v250.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply interactive 3D curl changes
        run: python3 tools/apply_v250.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VelocityTracker' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'handlePaperGesture' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'beginInteractive' app/src/main/java/com/whisper/wowreader/PageCurlView.java
          grep -q 'settleInteractive' app/src/main/java/com/whisper/wowreader/PageCurlView.java
          grep -q 'versionCode 17' app/build.gradle
          grep -q "versionName '2.5.0'" app/build.gradle
          git diff --check

      - name: Commit v2.5 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app .github/workflows/build-apk.yml
          git commit -m 'Add interactive 3D page curl for v2.5.0'
          git push origin HEAD:main
