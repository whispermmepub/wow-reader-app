name: Fix WoW Reader v2.13 Compile

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_v213_compile.py'
      - '.github/workflows/fix-v213-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix_v213_compile.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          git commit -m "Fix v2.13 reader prewarm import"
          git push
