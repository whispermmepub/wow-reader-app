name: Apply WoW Reader v2.10

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_v210.py'
      - '.github/workflows/apply-v210.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v2.10 changes
        run: python3 tools/apply_v210.py
      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          READER=app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'versionCode 22' app/build.gradle
          grep -q "versionName '2.10.0'" app/build.gradle
          grep -q 'reader_v210_animation_default_applied' "$READER"
          grep -q 'pageAnimation = "none"' "$READER"
          grep -q 'None · default' "$READER"
          grep -q 'chapterLoadGeneration' "$READER"
          grep -q 'WoW.onPageReady(' "$READER"
          grep -q 'stableHits' "$READER"
          grep -q 'forceChapterRepaginate' "$READER"
          grep -q 'revealStableChapter' "$READER"
          git diff --check
      - name: Commit v2.10 app source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'WoW Reader v2.10 stable chapter pagination and None default animation'
          git push origin HEAD:main
