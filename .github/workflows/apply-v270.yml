name: Apply WoW Reader v2.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v270.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add native Pyidaungsu font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/fonts
          curl -L --fail --retry 3 --retry-delay 2 \
            -o app/src/main/assets/fonts/pyidaungsu_native.ttf \
            https://raw.githubusercontent.com/AungMyoKyaw/Myanmar-Unicode-Fonts/master/Pyidaungsu/pyidaungsu.ttf
          test -s app/src/main/assets/fonts/pyidaungsu_native.ttf
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/fonts/pyidaungsu_native.ttf')
          data=p.read_bytes()
          assert len(data) > 150_000, len(data)
          assert data[:4] in (b'\x00\x01\x00\x00', b'OTTO', b'true'), data[:4]
          print('native font bytes', len(data))
          PY

      - name: Apply v2.7 changes
        run: python3 tools/apply_v270.py

      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'Collator.getInstance(new Locale("my", "MM"))' "$MAIN"
          grep -q 'library_sort' "$MAIN"
          grep -q 'Recently added' "$MAIN"
          grep -q 'Title · က–အ / A–Z' "$MAIN"
          grep -q 'pyidaungsu_native.ttf' "$MAIN"
          grep -q 'Added to Library' "$MAIN"
          grep -q 'importBook(data,false)' "$MAIN"
          ! grep -q 'if(openAfter)openBook' "$MAIN"
          grep -q 'versionCode 19' app/build.gradle
          grep -q "versionName '2.7.0'" app/build.gradle
          test -s app/src/main/assets/fonts/pyidaungsu_native.ttf
          git diff --check

      - name: Commit v2.7 app source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Add Pyidaungsu library titles and smart sorting for v2.7.0'
          git push origin HEAD:main
