name: Apply WoW Reader v2.12

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_v212_lint.py'
      - '.github/workflows/apply-v212.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply author lint compatibility fix
        run: python3 tools/patch_v212_lint.py
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/whisper/wowreader/MainActivity.java
          grep -q 'versionCode 24' app/build.gradle
          grep -q "versionName '2.12.0'" app/build.gradle
          grep -q 'play-services-auth:21.5.0' app/build.gradle
          grep -q 'Integer oldCount = counts.get(author)' "$MAIN"
          ! grep -q 'counts.getOrDefault' "$MAIN"
          git diff --check
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/whisper/wowreader/MainActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make author shelves compatible with Android 6'
          git push origin HEAD:main
