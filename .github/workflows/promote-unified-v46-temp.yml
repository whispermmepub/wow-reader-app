name: Promote unified WoW Reader v2.17.6 v46

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-unified-v46-temp.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Import approved Lab v46 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/whispermmepub/wow-reader-lab.git /tmp/wow-reader-lab
          git -C /tmp/wow-reader-lab checkout --quiet 74b50e40550f374497f74c5999483b17ab40dc7f

          rm -rf app tools
          cp -a /tmp/wow-reader-lab/app ./app
          cp -a /tmp/wow-reader-lab/tools ./tools
          cp /tmp/wow-reader-lab/build.gradle ./build.gradle
          cp /tmp/wow-reader-lab/settings.gradle ./settings.gradle
          cp /tmp/wow-reader-lab/gradle.properties ./gradle.properties
          cp /tmp/wow-reader-lab/.gitignore ./.gitignore

      - name: Production source guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q "compileSdk 36" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          grep -q "versionCode 46" app/build.gradle
          grep -q "versionName '2.17.6'" app/build.gradle
          test -s app/google-services.json
          test -s app/src/main/java/com/whisper/wowreader/MainActivity.java
          test -s app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          test -s app/src/main/java/com/whisper/wowreader/ReaderSearchIndex.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingProgressStore.java
          test -s app/src/main/java/com/whisper/wowreader/ReadingCalendarActivity.java
          grep -q 'GoogleAuthProvider.getCredential' app/src/main/java/com/whisper/wowreader/GoogleAccountAuth.java
          grep -q 'Scopes.DRIVE_APPFOLDER' app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java
          grep -q 'Show on page' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'renderBookSearchResults' app/src/main/java/com/whisper/wowreader/BookReaderActivity.java
          grep -q 'SwipeRefreshLayout' app/src/main/java/com/whisper/wowreader/MainActivity.java
          test ! -e app/src/main/java/com/whisper/wowreader/AutoLibrarySync.java
          git diff --check

      - name: Build lint and smoke-check promoted tree
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintDebug :app:lintRelease --stacktrace
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          RELEASE=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$DEBUG"
          test -s "$RELEASE"
          test -s "$AAB"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          for APK in "$DEBUG" "$RELEASE"; do
            "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
            "$AAPT" dump badging "$APK" | grep -q "versionCode='46'"
            "$AAPT" dump badging "$APK" | grep -q "versionName='2.17.6'"
            "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          done

      - name: Commit approved unified v46 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tools build.gradle settings.gradle gradle.properties .gitignore
          if git diff --cached --quiet; then
            echo 'Production source already matches approved Lab v46.'
          else
            git commit -m 'Release unified WoW Reader v2.17.6 v46'
            git push origin HEAD:main
          fi
