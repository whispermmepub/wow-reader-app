name: Build WoW Reader Install Test APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-install-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: APK checks and debug certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.whisper.wowreader'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='26'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.14.0'"
          cp "$APK" WoW-Reader-v2.14.0-AutoSync-Test.apk
          echo '=== DEBUG SIGNING CERTIFICATE ==='
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" || true

      - name: Upload install APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Reader-v2.14.0-AutoSync-Test
          path: WoW-Reader-v2.14.0-AutoSync-Test.apk
          if-no-files-found: error
          retention-days: 3
