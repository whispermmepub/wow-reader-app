name: Bootstrap WoW Reader Source

on:
  push:
    paths:
      - '.github/workflows/migrate-final-source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare finalized v2.3 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch wow-reader-app https://github.com/whispermmepub/wow-books.git /tmp/wow-books
          cd /tmp/wow-books

          sed -i '/f\.setXIncludeAware(false);/d' android-wow-reader/app/src/main/java/com/whisper/wowreader/EpubUtil.java
          python3 android-wow-reader/patch_android23_compat.py
          python3 android-wow-reader/patch_reader_v170.py
          python3 android-wow-reader/patch_reader_v180.py
          python3 android-wow-reader/patch_reader_v190.py
          python3 android-wow-reader/patch_reader_v200.py
          python3 android-wow-reader/patch_epub_v210.py
          python3 android-wow-reader/patch_reader_v210.py
          python3 android-wow-reader/patch_reader_v210_compile_fix.py
          python3 android-wow-reader/patch_epub_v220.py
          python3 android-wow-reader/patch_reader_v220.py
          python3 android-wow-reader/patch_reader_v220_restore_curl.py
          python3 android-wow-reader/patch_home_v230.py
          python3 android-wow-reader/patch_reader_v230.py
          python3 android-wow-reader/patch_reader_v230_webview_selection.py

          mkdir -p android-wow-reader/app/src/main/assets/fonts
          curl --retry 3 -fsSL https://raw.githubusercontent.com/whispermmepub/Font/main/subset-Pyidaungsu.woff2 -o android-wow-reader/app/src/main/assets/fonts/pyidaungsu.woff2
          curl --retry 3 -fsSL https://raw.githubusercontent.com/whispermmepub/Font/main/subset-A10_YoeShin-Regular.woff2 -o android-wow-reader/app/src/main/assets/fonts/yoeshin.woff2
          curl --retry 3 -fsSL https://raw.githubusercontent.com/whispermmepub/Font/main/subset-Burma2-Normal.woff2 -o android-wow-reader/app/src/main/assets/fonts/burma2.woff2

          cd "$GITHUB_WORKSPACE"
          rm -rf app build.gradle settings.gradle gradle.properties
          cp -a /tmp/wow-books/android-wow-reader/app ./app
          cp /tmp/wow-books/android-wow-reader/build.gradle ./build.gradle
          cp /tmp/wow-books/android-wow-reader/settings.gradle ./settings.gradle
          cp /tmp/wow-books/android-wow-reader/gradle.properties ./gradle.properties

          # Google account sync is intentionally disabled for v2.3.
          rm -f app/src/main/java/com/whisper/wowreader/GoogleDriveSync.java

          cat > .gitignore <<'EOF'
          .gradle/
          .idea/
          local.properties
          **/build/
          *.iml
          *.jks
          *.keystore
          EOF

          cat > README.md <<'EOF'
          # WoW Reader

          **WoW Reader** is an offline EPUB/PDF reader for the Whisper Of Words community.

          ## Current release
          - Version: **2.3.0**
          - Android package: `com.whisper.wowreader`
          - Minimum Android: 6.0 (API 23)
          - Target SDK: 35

          ## Reader features
          - EPUB and PDF offline reading
          - Page-by-page and vertical scroll modes
          - Myanmar smart justify / spacing adjustment
          - Publisher font plus Pyidaungsu, A10 YoeShin and Burma2
          - EPUB NAV/NCX table of contents with auxiliary-page filtering
          - Bookmarks, highlights and notes
          - Selected-text Translate shortcut for Myanmar / English
          - Light, Sepia and Dark themes
          - Paper page-turn animation
          - Reading progress and resume
          - Manual backup / restore
          - Grid / list library views

          ## Community links
          - Telegram channel: https://t.me/TheBookR
          - Discussion group: https://t.me/+rUiqzi2mdhNiNGZl
          - Website: https://saroatsin.com
          - Book reviews: https://whispermmepub.github.io/Review/

          Google Account / automatic Google Drive sync is currently disabled.
          EOF

      - name: Commit standalone source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "Import standalone WoW Reader v2.3.0 source"
          git push origin HEAD:main
